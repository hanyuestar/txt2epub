[project]
name = "txt2epub"
description = "A simple TXT to EPUB converter"
requires-python = ">=3.10"
keywords = [
  "ebook",
]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "charset-normalizer>=3.3.0",
    "langdetect>=1.0.0",
    "ebooklib>=0.18",
    "pillow>=10.4.0",
]
dynamic = ["version"]

[project.scripts]
txt2epub = "src.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.isort]
profile = "black"
